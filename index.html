<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <body>
  
<iframe id='ap-iframe' src="https://poc-ob-fi.dy.dev/ap/M4XgHA7GBMBssGYDcBjEBGd0AstvqQBcMtdsAGIA/new-page-url" title="Deploy Campaign using iframe - edit" loading="lazy" style="width:100vw;height:100vh;border:none;"></iframe>
      <!-- Script is used for URL parameters targeting -->
      <script>
        function setIframeSrc() {
          const currentUrl = window.location.href;
          const baseUrl = location.protocol + '//' + location.host + location.pathname;
          const params = new URLSearchParams(window.location.search);
          params.set('currentPageUrl', encodeURIComponent(baseUrl));
          const iframeSrc = 'https://poc-ob-fi.dy.dev/ap/M4XgHA7GBMBssGYDcBjEBGd0AstvqQBcMtdsAGIA/new-page-url?' + params.toString();
          document.getElementById('ap-iframe').src = iframeSrc;
        }
        setIframeSrc();
      </script>
      <!-- End of script -->

  </body>
